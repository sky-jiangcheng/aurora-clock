name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Verify and publish the committed package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version manifest.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag '$tag' does not match manifest.json version '$pkg'"
            exit 1
          fi
          echo "manifest version $pkg matches tag $GITHUB_REF_NAME"

      # The zip is built and verified locally (see docs/development.md) and
      # committed. Rebuilding it here previously dropped background.js and the
      # offscreen files, publishing a package that could not install.
      - name: Verify the committed package matches the source
        run: |
          set -euo pipefail
          test -f aurora-clock.zip || { echo "::error::aurora-clock.zip is not committed"; exit 1; }
          files="manifest.json popup.html popup.js styles.css options.html options.js background.js offscreen.html offscreen.js LICENSE"
          for f in $files; do
            test -f "$f" || { echo "::error::$f is missing from the repository"; exit 1; }
            unzip -p aurora-clock.zip "$f" > /tmp/zip-entry 2>/dev/null \
              || { echo "::error::$f is missing from aurora-clock.zip"; exit 1; }
            cmp -s "$f" /tmp/zip-entry \
              || { echo "::error::$f in aurora-clock.zip differs from the repository"; exit 1; }
          done
          for f in $(jq -r '[.icons[], .action.default_icon[]] | unique | .[]' manifest.json); do
            unzip -l aurora-clock.zip "$f" | grep -q "$f" \
              || { echo "::error::$f is missing from aurora-clock.zip"; exit 1; }
          done
          echo "aurora-clock.zip matches the source"

      - name: Upload and publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: aurora-clock.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          publisher-id: ${{ secrets.CWS_PUBLISHER_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true
